[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gazera"
version = "0.1.0"
description = "GAZERA Core — clean-room, vendor-neutral eye-tracking data analytics (MIT)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "FEI · HEL Lab, Gyeongsang National University" }]
keywords = ["eye-tracking", "gaze", "fixation", "saccade", "AOI", "research", "open-source"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
stats = ["statsmodels>=0.14", "pingouin>=0.5"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://sunbear5020.github.io/gazera/"
Source = "https://github.com/sunbear5020/gazera"

[project.scripts]
gazera = "gazera_core.cli:main"

[tool.setuptools]
packages = ["gazera_core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
